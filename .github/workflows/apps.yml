name: Apps (Windows, macOS, Android)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci
        working-directory: standalone-apps/electron
      - run: npm run dist
        working-directory: standalone-apps/electron
      - uses: actions/upload-artifact@v4
        with:
          name: NiimBlue-${{ matrix.os }}
          path: |
            standalone-apps/electron/dist/*.exe
            standalone-apps/electron/dist/*.dmg
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            standalone-apps/electron/dist/*.exe
            standalone-apps/electron/dist/*.dmg

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: standalone-apps/capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run build-www
      - run: npx cap sync android
      # ponytail: debug-signed APK so it installs without a keystore; switch to `npm run build-android` with KEYSTORE_* secrets for a Play Store release
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: standalone-apps/capacitor/android
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk NiimBlue.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NiimBlue-android
          path: standalone-apps/capacitor/NiimBlue.apk
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: standalone-apps/capacitor/NiimBlue.apk
